# Сборка установщика и публикация обновления.
# Запускается при каждом изменении в main. Если версия из package.json уже выпущена — ничего не делает.
name: release
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Версия уже выпущена?
        id: check
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v=$(node -p "require('./package.json').version")
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if gh release view "v$v" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then echo "exists=true" >> "$GITHUB_OUTPUT"; else echo "exists=false" >> "$GITHUB_OUTPUT"; fi
      - if: steps.check.outputs.exists == 'false'
        run: npm ci
      - if: steps.check.outputs.exists == 'false'
        run: npx electron-builder --win nsis --publish never
      - name: Опубликовать выпуск
        if: steps.check.outputs.exists == 'false'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v="${{ steps.check.outputs.version }}"
          ls dist
          gh release create "v$v" dist/latest.yml dist/*.exe dist/*.exe.blockmap -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "GT Помощник $v" --notes "Установщик: GT-Helper-Setup-$v.exe"
